<!-- Button trigger modal -->
  <!-- Modal -->
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Ajouter un élément</h5>
    </div>
    <div class="modal-body">
      <form id="form" action="{% url 'ajouter_planification' %}" enctype="multipart/form-data"  method="post"> 
        {% csrf_token %} 
        {{ form.as_p }}
        <input type="hidden" id="hidden_equipement_plan" name="equipement">
        <button type="submit" class="btn btn-success">Ajouter</button>
        <input value="Fermer" class="btn btn-secondary" data-mdb-ripple-init data-mdb-dismiss="modal">
      </form>
    </div>
  </div>
