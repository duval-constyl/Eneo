<!-- Button trigger modal -->
  <!-- Modal -->
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Supprimer un dossier</h5>
      <button type="button" class="btn-close" data-mdb-ripple-init data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <form id="form" hx-post="{{ request.path }}" action="" method="post">
          {% csrf_token %}
          <p>Voulez-vous supprimer le dossier {{ dossier.nom }}?</p>
          <button type="submit" class="btn btn-danger">Supprimer</button>
          <button type="button" data-bs-dismiss="modal" class="btn btn-info">Annuler</button>
        </form>
    </div>
  </div>
