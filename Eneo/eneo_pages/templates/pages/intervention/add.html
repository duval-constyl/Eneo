<!-- Button trigger modal -->
  <!-- Modal -->
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Ajouter une intervention</h5>
    </div>
    <div class="modal-body">
      <form action="{% url 'ajouter_intervention' %}" enctype="multipart/form-data"  method="post"> 
        {% csrf_token %} 
        {{ form.as_p }}
        <p>Liste materiel: <a href="{% url 'view_cart' %}"><span class="badge rounded-pill badge-warning fs-7">Voir</span></a></p>
        <button type="submit" class="btn btn-success">Ajouter</button>
        <button type="button" data-bs-dismiss="modal" class="btn btn-info">Annuler</button>
      </form>
    </div>
  </div>
