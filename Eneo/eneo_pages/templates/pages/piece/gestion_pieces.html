<!-- Button trigger modal -->
  <!-- Modal -->
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Mon panier</h5>
    </div>
    <div class="modal-body">
      <ul class="list-group list-group-light">
        {% for item in cart_items %}
        <li class="list-group-item">
          <div class="fw-bold mb-2">{{ item.nom }}</div>
          <div class="d-flex justify-content-between align-items-center">
            <div class="text-muted">Prix : {{ item.prix }} Fcfa</div>
            <div class="text-muted">Qté : {{ item.quantite }}</div>
            <a href="{% url 'remove_from_cart' item.id %}" class="badge rounded-pill badge-danger">Retirer</a>
          </div>
        </li>
        {% empty %}
        <p>Votre panier est vide</p>
        {% endfor %}
      </ul>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="fw-bold">Total</div>
        <div class="text-muted">{{ total_price }} Fcfa</div>
      </div>
      <form id="form" method="post" action="{% url 'confirm_cart' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Confirmer la commande</button>
      </form>    
    </div>
  </div>
