<!-- Button trigger modal -->
  <!-- Modal -->
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><strong>Voir la pièce de réchange</strong></h5>
        </div>
        <div class="modal-body">
          <div class="container mb-3">
            <div class="row">
                <div class="col-md-12 mb-3">
                  <img src="{% if piece.photo %}{{ piece.photo.url }}{% else %}/static/img/empty.jpg{% endif %}" class="card-img-top" alt="Image Description" style="height: 200px; border-radius: 5%;"/>
                </div>
                <div class="col-md-12">
                    <ul>
                        <li class="mb-2">Nom: <span class="text-muted">{{ piece.nom|capfirst }}</span></li>
                        <li class="mb-2">Description: <span class="text-muted">{{ piece.description }}</span></li>
                        <li class="mb-2">Quantité Initiale: <span class="text-muted">{{ piece.quantité_initial }}</span></li>
                        <li class="mb-2">Quantité Restante: <span class="text-muted">{{piece.quantité_disponible}}</span></li>
                        <li class="mb-2">Prix: <span class="text-muted">{{ piece.prix_unitaire }} Fcfa</span></li>
                    </ul>
                </div>
              </div>
          </div>  
        </div>
        <div class="modal-footer">
          <a href="{% url 'update_piece' piece.id %}" hx-get="{% url 'update_piece' piece.id %}" hx-target="#dialog" type="button" class="btn btn-warning me-3">Modifier</a>
          <a href="{% url 'delete_piece' piece.id %}" hx-get="{% url 'delete_piece' piece.id %}" hx-target="#dialog" type="button" class="btn btn-danger me-3">Supprimer</a>
        </div>
      </div>
