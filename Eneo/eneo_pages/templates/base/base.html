<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>PowerGuard</title>
    <!-- MDB icon -->
    <link rel="icon" href="{% static 'img/Eneo_Cameroon_logo.jpg' %}" type="image/x-icon" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <!-- Google Fonts Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- MDB -->
    <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <style>
      /* Apply transition for smooth scaling */
      /*.hover-image {
        transition: transform 0.3s ease; Smooth scaling transition 
      }*/
    
      /* Scale the image on hover */
      /*.hover-image:hover {
        height: 250px;
        transform: scale(1.1); /* Increases the size by 10% 
      }*/
    </style>
    <style>
          .card {
              transition: transform 0.3s; /* Smooth transition for the zoom effect */
          }
          .card:hover {
              transform: scale(1.05); /* Zoom effect on hover */
          }
          .card-link {
              text-decoration: none; /* Remove underline from the link */
              color: inherit; /* Inherit color from the card */
          }
    </style>
    <style>
      .description-list {
          list-style-type: decimal;
          padding-left: 20px;
          margin-top: 5px;
      }
      .description-list li {
          margin-bottom: 5px;
      }
    </style>
    
  </head>
  <body>
    {% include "../base/navbar.html" %}

    <!-- Start your project here-->
    {% block body %}
    
    {% endblock %}
    <!-- End your project here-->

    <div id="modal" class="modal fade" tabindex="-1">
      <div id="dialog" class="modal-dialog modal-dialog-scrollable" hx-target="this">
    
      </div>
    </div>

    <script>
      document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'dialog') {
          fetch("{% url 'get_cart_quantity' %}")  // Créez une vue pour renvoyer la quantité actuelle
            .then(response => response.json())
            .then(data => {
              document.getElementById('cart-quantity').textContent = data.quantity;
            });
        }
      });
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
          var typeIntervention = document.getElementById('type_intervention');
          var intervalIntervention = document.getElementById('interval_intervention').parentNode;
          
          function toggleIntervalVisibility() {
              if (typeIntervention.value === 'intervention corrective') {
                  intervalIntervention.style.display = 'none';
              } else {
                  intervalIntervention.style.display = 'block';
              }
          }
          
          typeIntervention.addEventListener('change', toggleIntervalVisibility);
          
          // Initial check
          toggleIntervalVisibility();
      });
      </script>

    <script>
      function openFullscreen(url) {
        event.preventDefault();
        window.open(url, '_blank', 'fullscreen=yes');
      }
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var accordions = document.querySelectorAll('.accordion');
        accordions.forEach(function(accordion) {
          new mdb.Collapse(accordion, {
            toggle: false
          });
        });
      });
    </script>

    <script>
      function toggleSubmitButton() {
          const fileInput = document.getElementById('file');
          const submitButton = document.getElementById('submit-button');
          // Enable the button if a file is selected, otherwise disable it
          submitButton.disabled = !fileInput.files.length;
      }
    </script>

    {% include "../base/footer.html" %}

    <!-- MDB -->
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="text/javascript" src="{% static 'js/mdb.umd.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/dialog.js' %}"></script>
  
    <!-- Custom scripts -->
    <script type="text/javascript"></script>
    <!-- Include your jQuery UI and datepicker scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>

    <script>
      // Initialize DataTable
      $(document).ready(function() {
          $('#myTable').DataTable({
              "paging": true,
              "pageLength": 10,
              "searching": false, // Disable search input
              "ordering": true,
              "scrollCollapse": true,
              "info": true,
              "responsive": true
          });
      });
    </script>
  </body>
</html>
