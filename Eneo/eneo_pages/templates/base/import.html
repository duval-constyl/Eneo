<!-- Button trigger modal -->
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Importer un fichier</h5>
          <button type="button" class="btn-close" data-mdb-ripple-init data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form action="{% url 'equipement_import' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="file mb-2">Sélectionner un fichier Excel:</label>
                <input type="file" id="file" name="file" class="form-control" accept=".xlsx, .xls">
            </div>
            <button type="submit" id="submit-button" class="btn btn-primary">Importer les données</button>
          </form>
        </div>
      </div>
    </div>
  </div>
