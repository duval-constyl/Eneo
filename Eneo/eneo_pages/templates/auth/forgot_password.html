{% extends "../auth/base.html" %}

{% block body %}
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-md-4">
            <div class="border rounded p-4 shadow">
                <h4 class="text-center mb-4">Mot de passe oublié</h4>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-info{% endif %}" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <!-- Email input -->
                    <div data-mdb-input-init class="form-outline mb-4">
                        <input type="email" required name="email" class="form-control" />
                        <label class="form-label" for="form1Example1">Adresse mail</label>
                    </div>

                    <!-- Submit button -->
                    <button class="btn btn-primary btn-block" type="submit">Réinitialiser MDP</button>

                    <div class="text-center mt-3">
                        <p>Si vous vous rappelez de votre MDP ? <a href="{% url 'login' %}">Connectez vous</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
